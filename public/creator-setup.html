<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreamwall — Creator Account Setup</title>
<link rel="stylesheet" href="/css/colors_and_type.css">
<script src="/theme-init.js"></script>
<link rel="stylesheet" href="/css/responsive.css">
<style>
  html, body { margin:0; background: var(--bg-0); }

  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius:6px; }

  @media (max-width: 560px) { .aicdb-setup-grid { grid-template-columns: 1fr !important; } }

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
