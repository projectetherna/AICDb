<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — AICDb</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/auth.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <div class="auth-brand">
        <img src="/assets/aicdb-mark.svg" width="56" height="56" alt="" />
        <div>
          <h1>Welcome back</h1>
          <p>Sign in to rate and discover AI cinema</p>
        </div>
      </div>

      <div id="alert" class="auth-alert" role="alert"></div>

      <button type="button" id="btn-google" class="btn btn-google"></button>

      <div class="auth-divider">or</div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>

      <p class="auth-footer">
        New here? <a href="/signup.html">Create an account</a>
      </p>
    </main>

    <script src="/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/js/auth.js"></script>
    <script>
      (async () => {
        const alertEl = document.getElementById('alert');
        try {
          await AICDB_AUTH.requireGuest();
          AICDB_AUTH.wireGoogleButton(document.getElementById('btn-google'), alertEl);
          AICDB_AUTH.wireLoginForm(document.getElementById('login-form'), alertEl);
        } catch (err) {
          AICDB_AUTH.showAlert(alertEl, err.message, 'error');
        }
      })();
    </script>
  </body>
</html>
