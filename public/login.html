<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Dreamwall</title>
  <link rel="icon" href="/assets/aicdb-favicon-32.png" type="image/png">
  <link rel="stylesheet" href="/css/colors_and_type.css">
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="/css/responsive.css">
  <style>
    html, body { margin: 0; background: var(--bg-0); }
    * { box-sizing: border-box; }
    a { color: inherit; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
</head>
<body>
  <div id="root"></div>

  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/js/auth.js"></script>
  <script src="data.js"></script>

  <!-- Primitives (Icon, Logo, Button, Avatar …) -->
  <script type="text/babel" src="Primitives.jsx"></script>
  <!-- Brand icons (GoogleIcon, FacebookIcon, InstagramIcon, XIcon, TikTokIcon) -->
  <script type="text/babel" src="BrandIcons.jsx"></script>
  <!-- Login.jsx provides Login, SocialButton, Field, PrimaryWideButton -->
  <script type="text/babel" src="Login.jsx"></script>

  <script type="text/babel">
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      static getDerivedStateFromError(err) { return { error: err }; }
      render() {
        if (this.state.error) {
          return (
            <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center',
              color:'var(--fg-0)', fontFamily:'var(--font-body)', padding:32, textAlign:'center' }}>
              <div>
                <p style={{ color:'var(--danger)', marginBottom:8 }}>Could not load sign-in page.</p>
                <pre style={{ font:'12px monospace', color:'var(--fg-2)', whiteSpace:'pre-wrap' }}>
                  {this.state.error.message}
                </pre>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // Redirect away if already logged in
    AICDB_AUTH.requireGuest().catch(() => {});

    // Wire Google sign-in for the Login component's social button
    window.AICDB_LOGIN_GOOGLE = async function(setError) {
      try {
        await AICDB_AUTH.getClient().then(sb =>
          sb.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.origin + '/auth/callback.html' },
          })
        );
      } catch (err) {
        if (setError) setError(err.message || 'Google sign-in failed.');
      }
    };

    // Wire generic OAuth (Facebook, X/twitter) — shows errors inline, never crashes
    window.AICDB_LOGIN_OAUTH = async function(provider, setError) {
      try {
        const sb = await AICDB_AUTH.getClient();
        const { error } = await sb.auth.signInWithOAuth({
          provider,
          options: { redirectTo: window.location.origin + '/auth/callback.html' },
        });
        if (error) throw error;
      } catch (err) {
        if (setError) setError(err.message || provider + ' sign-in failed.');
      }
    };

    // Wire email+password sign-in for the Login component
    window.AICDB_LOGIN_EMAIL = async function(email, password) {
      await AICDB_AUTH.signInWithPassword(email, password);
      // signInWithPassword in auth.js already does location.replace('/') on success
    };

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary><Login /></ErrorBoundary>
    );
  </script>
</body>
</html>
