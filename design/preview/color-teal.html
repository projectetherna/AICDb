<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Teal — secondary" subtitle="Links, Series type, positive status" viewport="700x175" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--bg-0); padding: 22px 26px; }
  .row { display:flex; gap:10px; }
  .sw { flex:1; height:88px; border-radius: var(--radius-md); display:flex; flex-direction:column; justify-content:flex-end; padding:10px 12px; }
  .sw .n { font: var(--text-label); }
  .sw .h { font: var(--text-data-sm); margin-top:2px; opacity:0.75; }
  .cap { font: var(--text-data-sm); color: var(--fg-2); margin-top:12px; }
  .cap b { color: var(--teal); font-weight:600; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#6fdbd3;color:#04201e;"><span class="n">bright</span><span class="h">#6fdbd3</span></div>
    <div class="sw" style="background:#4ecdc4;color:#04201e;"><span class="n">teal ●</span><span class="h">#4ecdc4</span></div>
    <div class="sw" style="background:#3aa9a1;color:#04201e;"><span class="n">press</span><span class="h">#3aa9a1</span></div>
    <div class="sw" style="background:#235754;color:#bdf0ec;"><span class="n">dim</span><span class="h">#235754</span></div>
    <div class="sw" style="background:rgba(78,205,196,0.13);color:#6fdbd3;border:1px solid var(--border-subtle);"><span class="n">ghost</span><span class="h">13%</span></div>
  </div>
  <div class="cap"><b>Teal — secondary.</b> Links, highlights, the Series content type, positive status &amp; high scores.</div>
</body>
</html>
