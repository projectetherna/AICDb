<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Borders" subtitle="Alpha-on-dark dividers" viewport="700x160" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--bg-0); padding: 22px 26px; }
  .row { display:flex; gap:16px; }
  .item { flex:1; height:70px; border-radius: var(--radius-md); background: var(--bg-1); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
  .n { font: var(--text-label); color: var(--fg-0); }
  .v { font: var(--text-data-sm); color: var(--fg-2); }
  .cap { font: var(--text-data-sm); color: var(--fg-2); margin-top:14px; }
  .cap b { color: var(--fg-1); font-weight:600; }
</style>
</head>
<body>
  <div class="row">
    <div class="item" style="border:1px solid rgba(245,243,239,0.07);"><span class="n">subtle</span><span class="v">white 7%</span></div>
    <div class="item" style="border:1px solid rgba(245,243,239,0.12);"><span class="n">default</span><span class="v">white 12%</span></div>
    <div class="item" style="border:1px solid rgba(245,243,239,0.20);"><span class="n">strong</span><span class="v">white 20%</span></div>
    <div class="item" style="border:1px solid rgba(216,90,48,0.55);"><span class="n" style="color:var(--coral-bright);">accent</span><span class="v">coral 55%</span></div>
  </div>
  <div class="cap"><b>Borders</b> — alpha-on-dark, never solid grey. Subtle for dividers, default for cards, accent for active/selected.</div>
</body>
</html>
