<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Coral — primary" subtitle="Actions, ratings, Movie type" viewport="700x175" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--bg-0); padding: 22px 26px; }
  .row { display:flex; gap:10px; }
  .sw { flex:1; height:88px; border-radius: var(--radius-md); display:flex; flex-direction:column; justify-content:flex-end; padding:10px 12px; }
  .sw .n { font: var(--text-label); }
  .sw .h { font: var(--text-data-sm); margin-top:2px; opacity:0.75; }
  .cap { font: var(--text-data-sm); color: var(--fg-2); margin-top:12px; }
  .cap b { color: var(--coral); font-weight:600; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#e8714a;color:#1a0d08;"><span class="n">bright</span><span class="h">#e8714a</span></div>
    <div class="sw" style="background:#d85a30;color:#1a0d08;"><span class="n">coral ●</span><span class="h">#d85a30</span></div>
    <div class="sw" style="background:#bd4a24;color:#1a0d08;"><span class="n">press</span><span class="h">#bd4a24</span></div>
    <div class="sw" style="background:#6b3220;color:#f5d6c9;"><span class="n">dim</span><span class="h">#6b3220</span></div>
    <div class="sw" style="background:rgba(216,90,48,0.14);color:#e8714a;border:1px solid var(--border-subtle);"><span class="n">ghost</span><span class="h">14%</span></div>
  </div>
  <div class="cap"><b>Coral — primary.</b> Actions, ratings, the Movie content type. Hover lightens, press darkens.</div>
</body>
</html>
