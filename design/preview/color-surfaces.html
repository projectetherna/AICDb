<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Surface stack" subtitle="Warm-neutral dark canvas → inputs" viewport="700x175" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--bg-0); padding: 22px 26px; }
  .row { display:flex; gap:0; border-radius: var(--radius-lg); overflow:hidden; border:1px solid var(--border-subtle); }
  .sw { flex:1; height:96px; display:flex; flex-direction:column; justify-content:flex-end; padding:10px 12px; }
  .sw .n { font: var(--text-label); color: var(--fg-0); }
  .sw .h { font: var(--text-data-sm); color: var(--fg-2); margin-top:2px; }
  .cap { font: var(--text-data-sm); color: var(--fg-2); margin-top:12px; }
  .cap b { color: var(--fg-1); font-weight:600; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:#0a0a0a;"><span class="n">bg-0</span><span class="h">#0a0a0a</span></div>
    <div class="sw" style="background:#151514;"><span class="n">bg-1</span><span class="h">#151514</span></div>
    <div class="sw" style="background:#1d1d1b;"><span class="n">bg-2</span><span class="h">#1d1d1b</span></div>
    <div class="sw" style="background:#262624;"><span class="n">bg-3</span><span class="h">#262624</span></div>
    <div class="sw" style="background:#050505;"><span class="n">inset</span><span class="h">#050505</span></div>
  </div>
  <div class="cap"><b>Surface stack</b> — warm-neutral dark. Canvas → cards → hover → inputs → recessed wells.</div>
</body>
</html>
