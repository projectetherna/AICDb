<!DOCTYPE html>
<!-- @dsCard group="Components" name="Film card" subtitle="Poster, type badge, score, stars" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--bg-0); padding: 20px 26px; display:flex; gap:20px; align-items:flex-start; }
  .card { width:138px; cursor:pointer; }
  .poster { aspect-ratio: 2/3; border-radius: var(--radius-lg); overflow:hidden; position:relative; box-shadow: var(--shadow-poster); }
  .p1 { background: linear-gradient(150deg,#3a2118,#d85a30 140%); }
  .p2 { background: linear-gradient(150deg,#10302d,#4ecdc4 150%); }
  .overlay { position:absolute; inset:0; opacity:0; transition: opacity var(--dur-base) var(--ease-out);
    background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.15) 55%, rgba(0,0,0,0.35) 100%);
    display:flex; flex-direction:column; justify-content:space-between; padding:10px; }
  .card:hover .overlay, .card.is-hover .overlay { opacity:1; }
  .badge { align-self:flex-start; padding:4px 9px; border-radius: var(--radius-pill); font:600 10px/1 var(--font-body); letter-spacing:0.04em; }
  .scorewrap { display:flex; align-items:baseline; gap:5px; }
  .score { font:700 22px/1 var(--font-mono); color:#fff; }
  .scorelbl { font:500 9px/1 var(--font-mono); letter-spacing:0.06em; color:rgba(255,255,255,0.6); text-transform:uppercase; }
  .title { font:600 13.5px/1.25 var(--font-body); color: var(--fg-0); margin-top:9px; }
  .year { font: var(--text-data-sm); color: var(--fg-2); margin-top:2px; }
  .hint { font: var(--text-overline); letter-spacing:0.08em; text-transform:uppercase; color: var(--fg-3); margin-top:14px; }
</style>
</head>
<body>
  <div>
    <div class="card">
      <div class="poster p1"><div class="overlay"></div></div>
      <div class="title">Synthetic Dreams</div>
      <div class="year">2025</div>
    </div>
    <div class="hint">default</div>
  </div>
  <div>
    <div class="card is-hover">
      <div class="poster p2">
        <div class="overlay">
          <span class="badge" style="background:#4ecdc4;color:#04201e;">SERIES</span>
          <div class="scorewrap"><span class="score">9.1</span></div>
        </div>
      </div>
      <div class="title">Echoes of Tomorrow</div>
      <div class="year">2024</div>
    </div>
    <div class="hint">hover</div>
  </div>
</body>
</html>
