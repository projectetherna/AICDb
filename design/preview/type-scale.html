<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type scale" subtitle="h1 → caption semantic tokens" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--bg-0); padding: 20px 26px; }
  .scale { display:flex; flex-direction:column; gap:9px; }
  .line { display:flex; align-items:baseline; gap:16px; }
  .tok { font: var(--text-data-sm); color: var(--fg-2); width:78px; flex:none; text-align:right; }
  .ex { color: var(--fg-0); white-space:nowrap; }
</style>
</head>
<body>
  <div class="scale">
    <div class="line"><span class="tok">h1 · 40</span><span class="ex" style="font:var(--text-h1);letter-spacing:-0.02em;">Tron: Ares</span></div>
    <div class="line"><span class="tok">h2 · 30</span><span class="ex" style="font:var(--text-h2);letter-spacing:-0.015em;">Top Rated This Week</span></div>
    <div class="line"><span class="tok">h3 · 22</span><span class="ex" style="font:var(--text-h3);">New &amp; Trending</span></div>
    <div class="line"><span class="tok">title · 18</span><span class="ex" style="font:var(--text-title);">Synthetic Dreams</span></div>
    <div class="line"><span class="tok">body · 15</span><span class="ex" style="font:var(--text-body);color:var(--fg-1);">A neon-soaked thriller rendered frame by frame.</span></div>
    <div class="line"><span class="tok">caption · 12</span><span class="ex" style="font:var(--text-caption);color:var(--fg-2);">Generated · 4K · Dolby Vision</span></div>
  </div>
</body>
</html>
