<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Content-type colors" subtitle="Movie / Series / Short / Vertical" viewport="700x175" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--bg-0); padding: 22px 26px; }
  .row { display:flex; gap:10px; }
  .item { flex:1; }
  .badge { display:inline-flex; align-items:center; gap:6px; padding:5px 11px; border-radius: var(--radius-sm); font: var(--text-label); letter-spacing:0.02em; }
  .dot { width:7px; height:7px; border-radius:50%; }
  .h { font: var(--text-data-sm); color: var(--fg-2); margin-top:8px; }
  .cap { font: var(--text-data-sm); color: var(--fg-2); margin-top:14px; }
  .cap b { color: var(--fg-1); font-weight:600; }
</style>
</head>
<body>
  <div class="row">
    <div class="item">
      <span class="badge" style="background:rgba(216,90,48,0.14);color:#e8714a;"><span class="dot" style="background:#d85a30;"></span>MOVIE</span>
      <div class="h">#d85a30</div>
    </div>
    <div class="item">
      <span class="badge" style="background:rgba(78,205,196,0.13);color:#6fdbd3;"><span class="dot" style="background:#4ecdc4;"></span>SERIES</span>
      <div class="h">#4ecdc4</div>
    </div>
    <div class="item">
      <span class="badge" style="background:rgba(229,178,59,0.14);color:#e5b23b;"><span class="dot" style="background:#e5b23b;"></span>SHORT</span>
      <div class="h">#e5b23b · added</div>
    </div>
    <div class="item">
      <span class="badge" style="background:rgba(157,141,241,0.15);color:#9d8df1;"><span class="dot" style="background:#9d8df1;"></span>VERTICAL</span>
      <div class="h">#9d8df1 · added</div>
    </div>
  </div>
  <div class="cap"><b>Content types</b> — Movie &amp; Series from brand palette; Short (gold) &amp; Vertical (lavender) added for distinction.</div>
</body>
</html>
