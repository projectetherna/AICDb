<!DOCTYPE html>
<!-- @dsCard group="Type" name="Data — JetBrains Mono" subtitle="Scores, runtime, counts, metadata" viewport="700x170" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--bg-0); padding: 22px 26px; }
  .big { font: 500 30px/1.1 var(--font-mono); color: var(--fg-0); letter-spacing:-0.01em; }
  .samples { display:flex; gap:26px; margin-top:16px; align-items:center; flex-wrap:wrap; }
  .samp { display:flex; flex-direction:column; gap:4px; }
  .samp .v { font: 600 26px/1 var(--font-mono); color: var(--coral); }
  .samp .v.teal { color: var(--teal); }
  .samp .l { font: var(--text-overline); letter-spacing:0.08em; text-transform:uppercase; color: var(--fg-2); }
  .meta { font: var(--text-data-sm); color: var(--fg-2); margin-top:16px; }
  .meta b { color: var(--fg-1); font-weight:600; }
</style>
</head>
<body>
  <div class="big">JetBrains Mono</div>
  <div class="samples">
    <div class="samp"><span class="v">8.7</span><span class="l">Score</span></div>
    <div class="samp"><span class="v teal">142 min</span><span class="l">Runtime</span></div>
    <div class="samp"><span class="v">2025</span><span class="l">Year</span></div>
    <div class="samp"><span class="v teal">24.1k</span><span class="l">Ratings</span></div>
  </div>
  <div class="meta"><b>Use</b> scores · runtime · counts · all tabular numerals &amp; metadata</div>
</body>
</html>
