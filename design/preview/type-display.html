<!DOCTYPE html>
<!-- @dsCard group="Type" name="Display — Archivo" subtitle="Editorial grotesk for headlines & film titles" viewport="700x170" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--bg-0); padding: 22px 26px; }
  .big { font: 700 60px/0.98 var(--font-display); letter-spacing:-0.015em; color: var(--fg-0); }
  .meta { font: var(--text-data-sm); color: var(--fg-2); margin-top:14px; display:flex; gap:18px; flex-wrap:wrap; }
  .meta b { color: var(--coral); font-weight:600; }
  .weights { display:flex; gap:20px; margin-top:8px; align-items:baseline; }
  .weights span { color: var(--fg-1); font-family: var(--font-display); }
</style>
</head>
<body>
  <div class="big">Spectral Display</div>
  <div class="weights">
    <span style="font-weight:500; font-size:21px;">Medium</span>
    <span style="font-weight:600; font-size:21px;">Semibold</span>
    <span style="font-weight:700; font-size:21px;">Bold</span>
    <span style="font-weight:600; font-style:italic; font-size:21px;">Italic</span>
  </div>
  <div class="meta">
    <span><b>Use</b> headlines · film titles · editorial accents</span>
    <span><b>Voice</b> refined · cinematic · literary serif</span>
    <span><b>Weights</b> 500–700 · italic for character</span>
  </div>
</body>
</html>
