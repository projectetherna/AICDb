<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo variants" subtitle="On dark / light / reversed / mono" viewport="700x170" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--bg-0); padding: 24px 26px; display:flex; gap:18px; }
  .tile { flex:1; aspect-ratio: 1.3/1; border-radius: var(--radius-lg); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; border:1px solid var(--border-subtle); }
  .tile img { filter: drop-shadow(0 4px 14px rgba(0,0,0,0.45)); }
  .lbl { font: var(--text-overline); letter-spacing:0.08em; text-transform:uppercase; color: var(--fg-2); }
  .mono img { filter: grayscale(1) brightness(1.4) drop-shadow(0 4px 14px rgba(0,0,0,0.45)); }
</style>
</head>
<body>
  <div class="tile" style="background:var(--bg-0);">
    <img src="../assets/aicdb-mark.png" width="72" height="72">
    <span class="lbl">On canvas</span>
  </div>
  <div class="tile" style="background:#f5f3ef;">
    <img src="../assets/aicdb-mark.png" width="72" height="72">
    <span class="lbl" style="color:#6f6c64;">On light</span>
  </div>
  <div class="tile mono" style="background:var(--bg-1);">
    <img src="../assets/aicdb-mark.png" width="72" height="72">
    <span class="lbl">Monochrome</span>
  </div>
</body>
</html>
