<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="sm → pill" viewport="700x175" -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--bg-0); padding: 22px 26px; }
  .row { display:flex; gap:18px; align-items:flex-end; }
  .item { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .box { width:64px; height:64px; background: linear-gradient(135deg,#262624,#1d1d1b); border:1px solid var(--border-default); }
  .n { font: var(--text-label); color: var(--fg-0); }
  .v { font: var(--text-data-sm); color: var(--fg-2); }
  .cap { font: var(--text-data-sm); color: var(--fg-2); margin-top:16px; }
  .cap b { color: var(--fg-1); font-weight:600; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:4px;"></div><span class="n">sm</span><span class="v">4px</span></div>
    <div class="item"><div class="box" style="border-radius:8px;"></div><span class="n">md</span><span class="v">8px</span></div>
    <div class="item"><div class="box" style="border-radius:12px;"></div><span class="n">lg</span><span class="v">12px</span></div>
    <div class="item"><div class="box" style="border-radius:16px;"></div><span class="n">xl</span><span class="v">16px</span></div>
    <div class="item"><div class="box" style="border-radius:999px;"></div><span class="n">pill</span><span class="v">999px</span></div>
  </div>
  <div class="cap"><b>Corner radii</b> — sm chips/tags · md buttons/fields · lg cards · xl modals · pill toggles &amp; avatars.</div>
</body>
</html>
