<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">

<link rel="icon" type="image/png" href="../../assets/aicdb-favicon.png">
</head>
<body>
  <template id="__bundler_thumbnail" data-bg-color="#0a0a0a">

      <circle cx="600" cy="330" r="110" fill="#151514" stroke="#262624" stroke-width="4"/>
      <path d="M555 330a45 45 0 0 1 90 0v55l-15-12-15 12-15-12-15 12-15-12z" fill="#d85a30"/>
      <circle cx="585" cy="322" r="7" fill="#0a0a0a"/>
      <circle cx="615" cy="322" r="7" fill="#0a0a0a"/>
      <text x="600" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="58" font-weight="700" fill="#f5f3ef">Truly. Nothing.</text>

  <script src="catalog-extra.js"></script>

  <script type="text/babel" src="CreatorParts.jsx"></script>
  <script type="text/babel" src="CreatorManage.jsx"></script>
  <script type="text/babel" src="Creator.jsx"></script>
  <script type="text/babel">

    const goApp = () => { window.location.href = 'Dreamwall%20Web%20App.html'; };
    ReactDOM.createRoot(document.getElementById('root')).render(<NoCreatorContent onApp={goApp} />);
  </script>
