<!-- @dsCard group="UI Kit — Web App" name="Web App — Dreamwall" subtitle="Interactive discovery + ratings prototype" viewport="1180x720" -->

<link rel="stylesheet" href="responsive.css">
<style>
  html, body { margin:0; background: var(--bg-0); }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius:6px; }
  ::-webkit-scrollbar-track { background: var(--bg-0); }
  a { color: inherit; }
  /* manifesto (What is Dreamwall) entrance — transform-only so content is never
     invisible in static captures/exports (a re-rendered clone can restart the
     animation at frame 0; keeping opacity at 1 guarantees text always shows). */
  .wi-reveal { animation: wiReveal 0.72s cubic-bezier(0.22,0.61,0.36,1) both; }
  @keyframes wiReveal { from { transform: translateY(26px); } to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .wi-reveal { animation: none; } }
  /* loading skeleton shimmer */
  @keyframes aicdbShimmer { 0% { background-position: -360px 0; } 100% { background-position: 360px 0; } }
  .aicdb-skel { background: linear-gradient(100deg, var(--bg-1) 30%, var(--bg-2) 50%, var(--bg-1) 70%);
    background-size: 720px 100%; animation: aicdbShimmer 1.25s linear infinite; }
  /* rating feedback */
  @keyframes aicdbScorePop { 0% { transform: scale(0.7); opacity: 0; } 55% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes aicdbGlowPulse { 0% { box-shadow: 0 0 0 0 rgba(216,90,48,0.55); } 70% { box-shadow: 0 0 0 18px rgba(216,90,48,0.0), 0 0 40px 6px rgba(216,90,48,0.35); } 100% { box-shadow: 0 0 0 0 rgba(216,90,48,0.0); } }
  @keyframes aicdbBackdropIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes aicdbCardIn { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: none; } }
  @keyframes aicdbConfettiFall { 0% { transform: translateY(-12px) rotate(0deg); opacity: 0; } 12% { opacity: 1; } 100% { transform: translateY(240px) rotate(420deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .aicdb-skel, .aicdb-pop, .aicdb-glow, .aicdb-confetti, .aicdb-cardin, .aicdb-backin { animation: none !important; } }
</style>
